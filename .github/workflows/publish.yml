name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node 24 ships npm 11.5+ required for OIDC trusted publishing
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Ensure modern npm CLI
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build & test
        run: npm run prepublishOnly

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Publishing with NPM_TOKEN (classic auth)"
            npm publish --access public
          else
            echo "Publishing with OIDC trusted publishing"
            # setup-node writes an empty _authToken placeholder when NODE_AUTH_TOKEN
            # is unset; that blocks the OIDC exchange. Remove it before publish.
            if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
              sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
            fi
            npm publish --access public --provenance
          fi
